# Landing (block-builder.ru) - HTTP without redirect
server {
    listen 80;
    server_name block-builder.ru www.block-builder.ru;
    # server_name block-builder.ru www.block-builder.ru;  # Старый домен

    location / {
        # Proxy to Landing
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Increase buffer sizes to handle large headers and responses from Next.js
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        
        # Increase timeouts for Next.js server-side rendering
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Keep connection alive for better performance
        proxy_set_header Connection "";
        
        # Handle upstream errors gracefully
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}

