# Landing (block-builder.ru) - HTTPS (commented until SSL certificates are obtained)
# server {
#     listen 443 ssl http2 default_server;
    server_name block-builder.ru www.block-builder.ru;

    # SSL Configuration - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/block-builder.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/block-builder.ru/privkey.pem;
    
    # SSL Settings - Inherited from global
    # ssl_protocols inherited from global
    # ssl_ciphers inherited from global
    ssl_stapling off;
    ssl_stapling_verify off;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js static files - optimized configuration
    location /_next/static/ {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Large buffers for static files
        proxy_buffer_size 128k;
        proxy_buffers 32 128k;
        proxy_busy_buffers_size 256k;
        proxy_buffering on;
        
        # Long timeouts for large files
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Keep connection alive - critical for preventing connection closure
        proxy_set_header Connection "keep-alive";
        
        # Don't add duplicate cache headers - Next.js already sets them
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
        proxy_pass_header Accept-Ranges;
        
        # Enable ranges for large files
        proxy_force_ranges on;
        
        # Increase buffers to prevent premature closure
        proxy_max_temp_file_size 0;
    }

    # Other static assets (images, fonts, etc)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffer_size 256k;
        proxy_buffers 64 256k;
        proxy_busy_buffers_size 512k;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_set_header Connection "keep-alive";
        proxy_set_header Keep-Alive "timeout=300";
        
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
        
        proxy_force_ranges on;
    }

    location / {
        # Proxy to Landing
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Increase buffer sizes to handle large headers and responses from Next.js
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        
        # Increase timeouts for Next.js server-side rendering
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Keep connection alive for better performance
        proxy_set_header Connection "";
        
        # Handle upstream errors gracefully
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
