name: Deploy Block Builder License Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_DIR: .

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker build -t bb-license-server:${{ github.sha }} -t bb-license-server:latest -f Dockerfile .

      - name: Save Docker image to tar
        run: |
          docker save bb-license-server:latest -o image.tar
          gzip image.tar
          ls -lh image.tar.gz
          pwd

      - name: Prepare files for deployment
        run: |
          # Create temporary directory with only necessary files
          mkdir -p deploy-temp
          
          # Copy necessary files and directories
          cp -r src deploy-temp/ || true
          cp -r migrations deploy-temp/ || true
          cp -r docker-nginx deploy-temp/ || true
          cp package.json deploy-temp/ || true
          cp package-lock.json deploy-temp/ || true
          cp tsconfig.json deploy-temp/ || true
          cp Dockerfile deploy-temp/ || true
          cp Dockerfile.dev deploy-temp/ || true
          cp docker-compose.prod.yml deploy-temp/ || true
          cp docker-compose.full.yml deploy-temp/ || true
          
          # Copy .env files (check different possible names)
          if [ -f .env.production.example ]; then
            cp .env.production.example deploy-temp/
          elif [ -f env.production.example ]; then
            cp env.production.example deploy-temp/.env.production.example
          elif [ -f env.example ]; then
            cp env.example deploy-temp/.env.production.example
          elif [ -f .env.example ]; then
            cp .env.example deploy-temp/.env.production.example
          fi
          
          # Copy other files
          [ -f .dockerignore ] && cp .dockerignore deploy-temp/ || true
          [ -f start.sh ] && cp start.sh deploy-temp/ || true
          
          # List copied files for debugging
          echo "Files in deploy-temp:"
          ls -la deploy-temp/
          echo "Looking for .env files:"
          find deploy-temp -name "*.env*" -o -name "*env*" || true
          
          # Set proper permissions
          chmod -R 755 deploy-temp

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_SSH_PORT || 22 }}
          source: "deploy-temp/*"
          target: "/opt/bb-license-server"
          overwrite: true

      - name: Upload Docker image to server
        run: |
          # Save SSH key to temp file
          echo "${{ secrets.VDS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          # Ensure directory exists on server
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p ${{ secrets.VDS_SSH_PORT || 22 }} \
              -i /tmp/deploy_key \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} \
              "mkdir -p /opt/bb-license-server"
          
          # Upload file via scp
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P ${{ secrets.VDS_SSH_PORT || 22 }} \
              -i /tmp/deploy_key \
              image.tar.gz \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/opt/bb-license-server/
          
          # Cleanup
          rm -f /tmp/deploy_key

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/bb-license-server
            
            # Move files from deploy-temp to current directory if they exist
            if [ -d deploy-temp ]; then
              echo "📦 Moving files from deploy-temp..."
              mv deploy-temp/* . 2>/dev/null || true
              mv deploy-temp/.* . 2>/dev/null || true
              rmdir deploy-temp 2>/dev/null || true
              echo "✅ Files moved"
            fi
            
            # List current directory for debugging
            echo "📁 Current directory contents:"
            ls -la | head -20
            
            # Load Docker image
            echo "📦 Loading Docker image..."
            if [ -f image.tar.gz ]; then
              gunzip -c image.tar.gz | docker load
              rm -f image.tar.gz
            else
              echo "⚠️  image.tar.gz not found, skipping image load"
            fi
            
            # Ensure .env file exists
            if [ ! -f .env ]; then
              echo "⚠️  .env file not found, creating from example..."
              # Check for different possible names
              if [ -f .env.production.example ]; then
                cp .env.production.example .env
                echo "✅ Created .env from .env.production.example"
                echo "❌ Please configure .env file on server before deploying!"
                exit 1
              elif [ -f env.production.example ]; then
                cp env.production.example .env
                echo "✅ Created .env from env.production.example"
                echo "❌ Please configure .env file on server before deploying!"
                exit 1
              elif [ -f env.example ]; then
                cp env.example .env
                echo "✅ Created .env from env.example"
                echo "❌ Please configure .env file on server before deploying!"
                exit 1
              elif [ -f .env.example ]; then
                cp .env.example .env
                echo "✅ Created .env from .env.example"
                echo "❌ Please configure .env file on server before deploying!"
                exit 1
              else
                echo "❌ No .env example file found! Available files:"
                ls -la | grep -E "\.env|env\." || ls -la
                exit 1
              fi
            else
              echo "✅ .env file already exists"
            fi
            
            
            # Detect docker compose command (docker compose or docker-compose)
            if docker compose version > /dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker compose"
            elif docker-compose --version > /dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker-compose"
            else
              echo "❌ Neither 'docker compose' nor 'docker-compose' found!"
              exit 1
            fi
            
            echo "📦 Using: $DOCKER_COMPOSE_CMD"
            
            # Stop host nginx to free ports 80/443 for Docker nginx
            echo "🛑 Stopping host nginx to free ports 80/443..."
            sudo systemctl stop nginx 2>/dev/null || echo "⚠️  Could not stop nginx (may not be running or need password)"
            sudo systemctl disable nginx 2>/dev/null || echo "⚠️  Could not disable nginx"
            
            # Check if ports are free
            if ss -tlnp | grep -E ':(80|443)' > /dev/null; then
              echo "⚠️  WARNING: Ports 80/443 are still in use!"
              ss -tlnp | grep -E ':(80|443)'
              echo "⚠️  Trying to kill processes on ports 80/443..."
              sudo fuser -k 80/tcp 2>/dev/null || true
              sudo fuser -k 443/tcp 2>/dev/null || true
              sleep 2
            else
              echo "✅ Ports 80/443 are free"
            fi
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml down || true
            
            # Build/rebuild nginx if needed (only on first deploy or config changes)
            echo "🔨 Building nginx container..."
            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml build nginx || true
            
            # Pull latest postgres image
            echo "🔄 Pulling base images..."
            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml pull postgres || true
            
            # Start services with new image
            echo "🚀 Starting services..."
            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml up -d
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f || true
            
            # Wait for health check
            echo "⏳ Waiting for services to be healthy..."
            sleep 15
            
            # Check health
            echo "🏥 Checking service health..."
            MAX_RETRIES=5
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -f http://localhost/health > /dev/null 2>&1; then
                echo "✅ Services are healthy!"
                break
              fi
              RETRY=$((RETRY + 1))
              if [ $RETRY -lt $MAX_RETRIES ]; then
                echo "⏳ Retry $RETRY/$MAX_RETRIES..."
                sleep 5
              else
                echo "⚠️  Health check failed after $MAX_RETRIES attempts."
                echo "Check logs with: $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml logs"
              fi
            done
            
            # Show status
            echo "📊 Service status:"
            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml ps

      - name: Cleanup
        if: always()
        run: |
          rm -f image.tar.gz
          rm -rf deploy-temp

